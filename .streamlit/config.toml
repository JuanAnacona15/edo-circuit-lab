# Tema visual de EDO Circuit Lab: neón futurista sobre fondo oscuro.
# (Los efectos de resplandor y animaciones viven en utils/styling.py.)
[theme]
base = "dark"
primaryColor = "#00e5ff"
backgroundColor = "#05060f"
secondaryBackgroundColor = "#0a0b1e"
textColor = "#e8ecff"

[server]
headless = true

[browser]
gatherUsageStats = false
